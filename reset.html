<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self'; connect-src https://sbimcawdabwyphxkihpe.supabase.co; base-uri 'none'; form-action 'none'"><title>Study Lab · Reset password</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div class="brand"><strong>study lab.</strong></div></header><div class="panel"><div class="eyebrow">ACCOUNT RECOVERY</div><h2>Reset password</h2><p id="status" role="status" aria-live="polite">Request a secure recovery link.</p><form id="request"><label>Email<input id="email" type="email" autocomplete="email" required></label><button class="primary wide" id="send" type="submit">Send recovery email</button></form><form id="change" hidden><label>New password<input id="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary wide" id="update" type="submit">Update password</button></form><p><a href="./">Return to Study Lab</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script><script>
const el=id=>document.getElementById(id);
const status=msg=>el('status').textContent=msg;
const redirect='https://ivanmalinovsky.github.io/study-lab/reset.html';
const params=new URLSearchParams(location.hash.slice(1));
const recovery=params.get('type')==='recovery'&&!!params.get('access_token');
const tokenError=params.has('error')||params.has('error_code')||new URLSearchParams(location.search).has('error');
if(!window.supabase){status('Login library failed to load. Reload while online.');}
else{
 const client=window.supabase.createClient("https://sbimcawdabwyphxkihpe.supabase.co","sb_publishable_L_-a9zz2QvYEUZzAQwPS8g_7rrxkF5v",{auth:{flowType:'implicit',persistSession:false,autoRefreshToken:false,detectSessionInUrl:true,storageKey:'study-lab-recovery-only'}});
 let ready=false;
 client.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session&&recovery){ready=true;el('request').hidden=true;el('change').hidden=false;status('Enter a new password for your Study Lab account.');}
 });
 (async()=>{const result=await client.auth.getSession();if(recovery&&!ready&&result.data?.session){ready=true;el('request').hidden=true;el('change').hidden=false;status('Enter a new password for your Study Lab account.');}else if(tokenError||(recovery&&!ready)){status('Recovery link is invalid or expired. Request a new one.');history.replaceState(null,'',location.pathname);}})().catch(()=>status('Could not verify the recovery link. Request a new one.'));
 el('request').onsubmit=async e=>{e.preventDefault();el('send').disabled=true;status('Sending…');try{const {error}=await client.auth.resetPasswordForEmail(el('email').value.trim(),{redirectTo:redirect});if(error)throw error;status('If the account exists, a recovery link will arrive by email. Check spam too.');}catch(e){status('Could not send recovery email: '+e.message);}finally{el('send').disabled=false;}};
 el('change').onsubmit=async e=>{e.preventDefault();if(!ready)return;let p=el('password').value;if(p!==el('confirm').value){status('Passwords do not match.');return;}el('update').disabled=true;try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;ready=false;el('change').reset();el('change').hidden=true;history.replaceState(null,'',location.pathname);try{await client.auth.signOut({scope:'local'});}catch(e){}status('Password updated. Return to Study Lab and sign in with the new password.');}catch(e){status('Password update failed: '+e.message);}finally{p='';el('update').disabled=false;}};
}
</script></body></html>
